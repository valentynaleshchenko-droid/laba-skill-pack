<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>[hidden]{display:none!important}body{margin:0}</style>
</head>
<body>
<title>Skill Pack LABA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: steps 1–2 as chips; step 3 = shop: toolbar + tile grid on the left, sticky cart (3 slots, −40% unlock) on the right; on phones the cart is a bottom bar + drawer */
:root{
  /* LABA: жовтий бренд-фон, майже чорний текст, помаранчевий CTA, Montserrat. Свідомо лише світла тема. */
  --yellow:#FFEF76; --yellow-2:#FFE24D; --bg:#FFFFFF; --surface:#FFFFFF; --ink:#131313; --muted:#5E5E5E; --line:#E7E7E1;
  --accent:#131313; --accent-ink:#FFFFFF; --accent-soft:#FFF8C9; --mark:#FFEF76; --mark-ink:#131313;
  --cta:#FD5432; --cta-2:#FF7A3D; --ok:#178A55; --shade:rgba(19,19,19,.45);
  --f-display:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px; color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:0 110px}
.wrap{max-width:1200px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
header{padding-block:36px 20px;display:grid;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,5vw,48px);line-height:1.08;margin:0;text-wrap:balance;max-width:18ch}
h1 mark{background:var(--mark);color:var(--mark-ink);padding:0 .15em;border-radius:6px}
.lead{color:var(--muted);max-width:62ch;margin:0}
.how{display:flex;flex-wrap:wrap;gap:8px 20px;margin:4px 0 0;padding:0;list-style:none;font-size:14px;color:var(--muted)}
.how b{color:var(--ink)}
.step{display:grid;gap:12px;padding-block:18px;border-top:1px solid var(--line)}
.step-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.step-n{font-family:var(--f-display);font-size:13px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:99px;width:28px;height:28px;display:inline-grid;place-items:center;flex:none}
h2{font-family:var(--f-display);font-weight:500;font-size:18px;margin:0}
.hint{font-size:14px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:15px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:8px 14px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .cnt{font-size:12px;opacity:.7}
:is(.chip,.btn,.seg button,.add,.x,a,input):focus-visible{outline:3px solid var(--mark);outline-offset:2px}

.main{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:28px;align-items:start;padding-top:8px}
@media (max-width:960px){.main{grid-template-columns:minmax(0,1fr)}}
.sec-title{font-family:var(--f-display);font-weight:500;font-size:14px;margin:0 0 12px;color:var(--muted);letter-spacing:.02em}

/* ready bundles */
.ready{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:28px}
.rb{background:var(--accent-soft);border-radius:var(--r);padding:16px;display:grid;gap:10px;grid-template-rows:auto auto 1fr auto}
.rb h3{font-family:var(--f-display);font-weight:500;font-size:15px;margin:0}
.rb ol{margin:0;padding-left:18px;font-size:14px;display:grid;gap:3px;align-content:start}
.rb .why{font-size:13px;color:var(--muted);margin:0}
.rb .pr{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.old{text-decoration:line-through;color:var(--muted);font-size:14px}
.new{font-weight:700;font-size:18px}

/* toolbar */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.search{flex:1 1 220px;min-width:0;font:inherit;font-size:15px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;border:0;background:transparent;color:var(--ink);padding:9px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.count{font-size:14px;color:var(--muted);margin:0 0 12px}

/* tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tile{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:8px;grid-template-rows:auto auto auto 1fr auto auto auto auto;min-width:0;transition:border-color .15s}
.tile.in{border-color:var(--accent);background:linear-gradient(var(--accent-soft),var(--accent-soft)) top/100% 4px no-repeat,var(--surface)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--bg);color:var(--muted);font-weight:500}
.tag.ind{background:var(--mark);color:var(--mark-ink)}
.tile h3{font-size:17px;font-weight:600;margin:0;line-height:1.3}
.author{font-size:13px;color:var(--muted);display:block;font-weight:400;margin-top:2px}
.who{margin:0;font-size:14px}
.who b{font-weight:600}
.meta{font-size:13px;color:var(--muted);margin:0}
.more{font-size:14px;margin:0}
.more summary{cursor:pointer;color:var(--accent);font-weight:500;list-style:none}
.more summary::-webkit-details-marker{display:none}
.more summary::after{content:" ▾"}
.more[open] summary::after{content:" ▴"}
.more p{margin:6px 0;color:var(--muted)}
.more a{color:var(--accent)}
.buy{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:8px;border-top:1px solid var(--line)}
.price{font-weight:700;font-size:17px}
.price small{display:block;font-weight:500;font-size:12px;color:var(--ok)}
.add{font:inherit;font-size:14px;font-weight:600;border-radius:10px;padding:9px 14px;cursor:pointer;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.add.on{background:transparent;color:var(--accent)}
.add:disabled{opacity:.4;cursor:not-allowed}
.nores{color:var(--muted);padding:20px 0}

/* cart */
.cart{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:14px;max-height:calc(100vh - 32px);overflow:auto}
.cart-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cart h2{font-size:17px}
.close{display:none;font:inherit;font-size:22px;background:none;border:0;color:var(--muted);cursor:pointer;line-height:1}
.unlock-old{border-radius:12px;padding:12px;background:var(--bg);display:grid;gap:8px;font-size:14px}
.unlock.go{background:var(--mark);color:var(--mark-ink)}
.meter{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.meter i{height:7px;border-radius:9px;background:var(--line)}
.meter i.on{background:var(--accent)}
.unlock.go .meter i.on{background:var(--mark-ink)}
.slots{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.slot{border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--muted);min-height:52px;display:flex;align-items:center}
.slot.full{border-style:solid;color:var(--ink);background:var(--bg);display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:start}
.slot .sn{font-weight:600;line-height:1.3}
.slot .sn span{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:0 2px}
.sum{display:grid;gap:6px;font-size:15px;margin:0}
.sum div{display:flex;justify-content:space-between;gap:10px}
.sum .disc{color:var(--ok)}
.sum .lock{color:var(--muted)}
.sum .tot{font-weight:700;font-size:20px;padding-top:6px;border-top:1px solid var(--line)}
.btn{font:inherit;font-size:15px;font-weight:600;border-radius:12px;padding:12px 16px;cursor:pointer;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);width:100%}
.btn.ghost{background:transparent;color:var(--accent);font-size:14px;padding:9px 14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.sugg{display:grid;gap:8px}
.sugg h3{font-size:13px;font-weight:600;color:var(--muted);margin:0;text-transform:uppercase;letter-spacing:.06em}
.sg{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-size:14px}
.sg span{color:var(--muted);font-size:12px;display:block}
.sg .add{padding:6px 10px;font-size:13px}
.order{display:grid;gap:8px;font-size:14px}
.copybox{width:100%;min-height:150px;font:inherit;font-size:13px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px}
.toast{font-size:13px;color:var(--ok);min-height:1.2em;margin:0}
.note{font-size:12px;color:var(--muted);margin:0}


/* who-am-i */
.me{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:12px;margin-bottom:8px}
.me h2{font-size:20px}
.me-row{display:flex;gap:10px;flex-wrap:wrap}
.me-in{flex:1 1 280px;min-width:0;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.me-in:focus{border-color:var(--accent);outline:none}
.ex{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.ex button{font:inherit;font-size:13px;border:0;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:4px 10px;cursor:pointer}
.me-res{display:grid;gap:10px}
.me-res .grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.fit{font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--ok);color:var(--surface)}
.segs{display:flex;flex-wrap:wrap;gap:4px;margin:0;padding:0;list-style:none}
.segs li{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:2px 8px;color:var(--muted)}
.segs li.hit{border-color:var(--ok);color:var(--ok);font-weight:600}
.more ul{margin:6px 0;padding-left:18px;color:var(--muted)}
.more li b{color:var(--ink);font-weight:600}


.grow{display:grid;gap:18px;border-top:1px dashed var(--line);padding-top:16px}
.grow:first-child{border-top:0}
.grow-q{display:grid;gap:8px}
.grow-q h3{font-family:var(--f-display);font-weight:500;font-size:17px;margin:0}
.grow-row{display:grid;gap:10px}
.grow-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grow .grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.mixb{max-width:420px}
.set{display:grid;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.set-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;background:var(--mark);color:var(--mark-ink)}
.pill.off{background:var(--bg);color:var(--muted)}
.chips.mini .chip{font-size:13px;padding:5px 10px}

.resetbar,.countrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.resetbar{margin-top:8px}
.countrow{margin-bottom:12px}
.countrow .count{margin:0}
.reset{font:inherit;font-size:14px;font-weight:600;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:6px 14px;cursor:pointer}
.reset:hover{border-color:var(--accent);color:var(--accent)}
.reset:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.perk{margin:0;font-size:13px;font-weight:500;color:var(--ink);background:var(--mark);background:color-mix(in srgb,var(--mark) 35%,transparent);border-radius:8px;padding:6px 9px}
.more h4{margin:10px 0 2px;font-size:13px;font-weight:600;color:var(--ink)}
.more .fm{color:var(--muted)}
.more .fm b{color:var(--ink);font-weight:600}
.ba{display:grid;grid-template-columns:1fr;gap:2px}
.ba ul{padding-left:16px}
.ba div:first-child li::marker{color:var(--muted)}
.ba div:last-child li::marker{color:var(--ok)}
.startbox{display:grid;gap:10px;background:var(--accent-soft);border-radius:14px;padding:16px}
.steps{margin:0;padding-left:20px;display:grid;gap:4px;font-size:15px}
.steps b{font-weight:600}

/* ===== LABA skin ===== */
html,body{overflow-x:clip}
.brand .tag{border:0;background:#fff;border-radius:99px;padding:4px 12px}
body{font-size:15px;letter-spacing:-.005em}
.hero{position:relative;background:var(--yellow);box-shadow:0 0 0 100vmax var(--yellow);clip-path:inset(0 -100vmax);padding-bottom:28px;isolation:isolate}
.hero::before,.hero::after{content:"";position:absolute;z-index:-1;border-radius:50%;border:38px solid var(--yellow-2);opacity:.75;pointer-events:none}
.hero::before{width:320px;height:320px;right:-60px;top:-140px}
.hero::after{width:220px;height:220px;left:-140px;top:180px}
.brand{display:flex;align-items:center;gap:14px;letter-spacing:0;text-transform:none;color:var(--ink)}
.brand .logo{font-weight:800;font-size:26px;letter-spacing:-.04em}
.brand .tag{font-size:13px;font-weight:600}
h1{font-weight:800;letter-spacing:-.03em;font-size:clamp(32px,5.4vw,58px);line-height:1.02}
h1 mark{background:var(--ink);color:var(--yellow);border-radius:10px;padding:0 .18em}
.lead{color:var(--ink);font-weight:500;font-size:16px}
.how{color:var(--ink)}
.how li{background:rgba(255,255,255,.55);border-radius:99px;padding:4px 12px;font-weight:500}
.how b{font-weight:800}
h2{font-weight:800;letter-spacing:-.02em}
.me{border:0;box-shadow:0 12px 40px rgba(19,19,19,.10);border-radius:20px}
.me h2{font-size:clamp(18px,2.4vw,24px)}
.me-in{background:#F6F6F2;border-color:transparent;font-weight:500;border-radius:12px}
.me-in:focus{border-color:var(--ink);background:#fff}
.ex button{background:#fff;color:var(--ink);font-weight:500;border:1.5px solid var(--line);padding:5px 11px}
.ex button:hover{border-color:var(--ink);background:#fff}
.sec-title{font-weight:800;color:var(--ink);font-size:15px;letter-spacing:-.01em}
.btn,.add{border-radius:10px;font-weight:700}
.add{background:var(--ink);border-color:var(--ink)}
.add.on{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
.btn.ghost{border-color:var(--ink);color:var(--ink)}
.btn.ghost:hover{background:var(--yellow)}
#order,.bar .btn{background:linear-gradient(90deg,var(--cta),var(--cta-2));border:0;color:#fff}
.tile{border:1.5px solid var(--line);border-radius:16px;transition:border-color .15s,box-shadow .15s,transform .15s}
.tile:hover{border-color:var(--ink);box-shadow:0 8px 24px rgba(19,19,19,.08)}
.tile.in{border-color:var(--ink);background:linear-gradient(var(--yellow),var(--yellow)) top/100% 6px no-repeat,var(--surface)}
.tile h3{font-weight:700;letter-spacing:-.01em}
.perk{background:var(--yellow);font-weight:600}
.fit{background:var(--ink);color:var(--yellow);font-weight:700;border-radius:99px}
.tag.ind{background:var(--yellow)}
.segs li.hit{border-color:var(--ink);color:var(--ink);background:var(--yellow)}
.price{font-weight:800;font-size:19px}
.price small{color:var(--cta);font-weight:700}
.more summary,.more a,a.more{color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px}
.rb,.startbox{background:var(--accent-soft);border:1.5px solid var(--yellow-2)}
.new{color:var(--ink);font-weight:800}
.cart{border:0;box-shadow:0 12px 40px rgba(19,19,19,.10);border-radius:20px}
.cart h2{font-size:20px}
.meter i.on{background:var(--ink)}
.pill{background:var(--yellow);color:var(--ink)}
.set.done .meter i.on{background:var(--cta)}
.sum .disc{color:var(--cta);font-weight:700}
.sum .tot{font-size:22px;font-weight:800}
.seg{border-radius:10px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--yellow)}
.search{border-radius:10px;background:#F6F6F2;border-color:transparent}
.reset{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--yellow)}
.step{border-top:0;padding-top:28px}
.toast{color:var(--ok)}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}

.filters{display:grid;gap:10px;margin:4px 0 14px}
.frow{display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px;align-items:start}
.flabel{font-size:13px;font-weight:700;padding-top:9px}
.filters .chip{font-size:14px;padding:7px 12px;font-weight:500}
.chip:disabled{opacity:.35;cursor:default}
@media (max-width:600px){.frow{grid-template-columns:1fr}.flabel{padding-top:0}}
.segs{align-items:flex-start;align-content:flex-start}
.segs li{line-height:1.35}
.ask{display:grid;gap:8px;background:var(--accent-soft);border:1.5px solid var(--yellow-2);border-radius:14px;padding:12px 14px}
.ask-row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;align-items:start}
.ask .chip{font-size:13px;padding:6px 11px;font-weight:600;background:#fff;border-color:transparent}
.ask .chip:hover{border-color:var(--ink)}
@media (max-width:600px){.ask-row{grid-template-columns:1fr}}
/* кошик: нижня панель + шухляда (на десктопі — праворуч) */
@media (min-width:961px) and (max-width:1099px){
  .cart{left:auto!important;top:0!important;bottom:0!important;width:420px;max-height:none!important;border-radius:20px 0 0 20px!important;transform:translateX(105%)!important}
  .cart.open{transform:none!important}
  .bar{left:auto!important;right:24px!important;bottom:24px!important;border-radius:16px;border:0!important;box-shadow:0 12px 40px rgba(19,19,19,.18);min-width:340px}
}

.bf{background:var(--ink);color:var(--yellow);font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;border-radius:99px;padding:5px 12px}
.perks{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 0;padding:0;list-style:none}
.perks li{background:#fff;border-radius:12px;padding:8px 14px;font-size:14px;font-weight:500}
.perks b{font-weight:800}
h1{max-width:22ch}

/* кошик завжди на виду: на широкому екрані — липка колонка праворуч */
.layout{display:block}
.me{min-width:0}
@media (min-width:1100px){
  .wrap{max-width:1360px}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
  .cart{position:sticky!important;top:16px!important;left:auto!important;right:auto!important;bottom:auto!important;transform:none!important;max-height:calc(100vh - 32px)!important;overflow:auto;z-index:2;border-radius:20px!important;width:auto;padding-bottom:20px!important}
  .cart .close{display:none}
  .bar,.shade{display:none!important}
  .me-res .grid,.grow .grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
}
.cart{border:2px solid var(--ink)}
.cart-h h2{display:flex;align-items:center;gap:10px}
.cart-h .cnt-badge{background:var(--yellow);border-radius:99px;font-size:14px;padding:2px 10px;font-weight:800}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
.bump{animation:bump .35s ease}
@media (min-width:1100px){.cart.bump{animation:bump .35s ease}}
.bar{border:2px solid var(--ink)}
.bar .dots{display:inline-flex;gap:4px;margin-right:8px;vertical-align:middle}
.bar .dots i{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.bar .dots i.on{background:var(--cta)}
@media (prefers-reduced-motion:reduce){.bump{animation:none}}

.tile{grid-template-rows:auto auto auto auto auto 1fr auto!important;gap:10px}
.tmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.tmeta .ls{white-space:nowrap}

function topicCourses(sp,tps){
  if(typeof tps==="string") tps=[tps];
  const any=!tps.length;
  return COURSES.filter(c=>(any||hits(c,tps)>0)&&inSphere(c,sp))
    .sort((a,b)=>(specific(b,sp)-specific(a,sp))||(hits(b,tps)-hits(a,tps))||(a.r-b.r));
}
function uniqTake(arr,n,skip=[]){ const out=[],names=new Set(skip.map(c=>c.n)); for(const c of arr){ if(names.has(c.n)) continue; names.add(c.n); out.push(c); if(out.length===n) break;} return out; }

function readyBundles(sp,tps){
  const pool=topicCourses(sp,tps); const res=[];
  const core0=pool.filter(c=>tps.includes(c.t[0])); const core=core0.length>=3?core0:pool;
  const near=k=>(a,b)=>(specific(b,sp)-specific(a,sp))||(Math.abs(a.r-k)-Math.abs(b.r-k));
  if(tps.length>1){
    const cover=[]; for(const t of tps.slice(0,3)){ const c=uniqTake(pool.filter(x=>x.t.includes(t)).sort((a,b)=>((b.t[0]===t)-(a.t[0]===t))||near(2)(a,b)),1,cover)[0]; if(c) cover.push(c); }
    const mix=[...cover,...uniqTake([...pool].sort(near(2)),3-cover.length,cover)].slice(0,3);
    if(mix.length===3) res.push({name:"Мікс обраних тем",why:"По курсу з кожної теми.",ids:mix.map(c=>c.id)});
  }
  const ind=COURSES.filter(c=>c.t.includes("ind")&&specific(c,sp));
  const other=tps.filter(t=>t!=="ind");
  if(ind.length && other.length){
    const rest=uniqTake(topicCourses(sp,other).filter(c=>!c.t.includes("ind")).sort(near(2.5)),2);
    if(rest.length===2) res.push({name:"Під мою галузь",why:"Галузевий курс і два з обраних тем.",ids:[ind[0].id,...rest.map(c=>c.id)]});
  }
  if(!other.length && ind.length){
    const add=uniqTake(COURSES.filter(c=>c.s.includes("all")&&(c.t.includes("fin")||c.t.includes("mkt"))&&c.r<=2),2);
    res.push({name:"Власник у галузі",why:"Галузь, фінанси і маркетинг для власника.",ids:[ind[0].id,...add.map(c=>c.id)]});
  }
  const b1=uniqTake([...core].sort((a,b)=>a.r-b.r),3), b2=uniqTake([...core].sort((a,b)=>b.r-a.r),3);
  if(b1.length===3) res.push({name:"Перший крок",why:"Щоб закласти базу в темі.",ids:b1.map(c=>c.id)});
  if(b2.length===3) res.push({name:"Наступний рівень",why:"Для досвідчених і керівників.",ids:b2.map(c=>c.id)});
  const seen=new Set(); return res.filter(b=>{const k=[...b.ids].sort().join(); if(seen.has(k)) return false; seen.add(k); return true;}).slice(0,3);
}

function scoreAll(text){

// курс підходить людині, якщо він для керівників/власників або збігається з її роллю
const BOSSRX=/власни|підприєм|ceo|топменеджер|засновник|фаундер|директор|керівник|керівниц|менеджер середньої ланки|управлін/;
const isBossCourse=c=>[...c.k,...c.seg].some(k=>BOSSRX.test(k.toLowerCase()));
function roleFit(c,base){
  if(!base) return true;
  const roles=detectRoles(base);
  if(roles.length&&c.aud&&c.aud.length&&!roles.some(r=>c.aud.includes(r))) return false;
  const us=[...new Set(words(base).map(stem))], dom=us.filter(u=>!isGen(u));
  const all=[...c.nx,...c.kx.flatMap(k=>k.w),...c.sx.flatMap(x=>x.w)];

  const narrow=/^(hr|рекрут|юрист|адвокат|бухгалт|головн(ий)? бухгалт|smm|таргет|розробник|фандрейз)/;
  const specialist=c.k.slice(0,2).some(k=>narrow.test(k.toLowerCase()));

// вибір через кнопки «Хто ти?»: курси напряму для цієї ролі й рівня
function rolePicks(key,role,skipIds){
  const g=GROW.find(x=>x[0]===key);
  const lvl={nov:["J"],spec:["J","M"]}[role];
  const boss=role==="own"||role==="head";
  const ok=c=>!role||boss||((!c.aud||!c.aud.length||c.aud.includes(role))&&(!lvl||!c.sn||!c.sn.length||c.sn.some(s=>lvl.includes(s))));
  const top=c=>(key==="ai"&&/^AI /.test(c.n))||(key==="sales"&&/продаж|переговор/i.test(c.n))?0:1;
  return COURSES.filter(c=>g[2](c)&&!skipIds.has(c.id)&&ok(c)).sort((a,b)=>(top(a)-top(b))||(a.r-b.r)||(b.p-a.p));

function growPicks(key,base,avgR,skipIds){
  const g=GROW.find(x=>x[0]===key);
  const boss=c=>isBossCourse(c)?3:0;
  const rolesB=base?detectRoles(base):[];
  const ROLE_FIRST={own:/власни|підприєм|ceo|засновн|топ/,head:/керівни|head|директор|lead/,spec:/менеджер|фахів|спеціаліст|аналітик|бухгалт|маркетол|hr/,nov:/початків|новач|світч|хоче стати/};
  const primary=c=>rolesB.some(r=>[...c.seg.slice(0,2),...c.k.slice(0,3)].some(s=>ROLE_FIRST[r].test(s.toLowerCase())))?4:0;
  const val=c=>(specific(c,st.sphere)?2:0)+(c.t[0]===key?2:0)+(key==="data"&&c.dir==="data"?6:0)+(rolesB.length?primary(c):boss(c))-Math.abs(c.r-avgR)*0.4;
  // усі курси напряму: спершу ті, що пасують ролі людини
  // без опису — усі курси напряму; з описом — лише ті, що пасують ролі й сфері людини
  if(base) setCtx(base);
  const ok=c=>!base||(roleFit(c,base)&&nicheOk(c)&&audOk(c,CTX.roles||[]));
  // за складністю: Junior → Middle → Senior; всередині рівня — що краще пасує людині
  const pool=COURSES.filter(c=>g[2](c)&&!skipIds.has(c.id)&&ok(c)).sort((a,b)=>(a.r-b.r)||(val(b)-val(a)));
  return pool;
}

  const last=chunks(st.pick.map(byId)).pop(), names=new Set(st.pick.map(id=>byId(id).n));
  const pt=new Set(last.flatMap(c=>c.t)), avgR=last.reduce((s,c)=>s+c.r,0)/last.length;
  return COURSES.filter(c=>!names.has(c.n)&&inSphere(c,st.sphere)&&(!st.topics.length||hits(c,st.topics)>0||whoHits[c.id]!==undefined))
    .map(c=>({c,score:(specific(c,st.sphere)?3:0)+(whoHits[c.id]!==undefined?3:0)+(c.t.some(t=>!pt.has(t))?2:0)-Math.abs(c.r-avgR)}))
    .sort((a,b)=>b.score-a.score).map(x=>x.c).filter((c,i,a)=>a.findIndex(y=>y.n===c.n)===i).slice(0,3);
}
function orderText(){
  const T=totals();
  return `Вітаю! Хочу Skill Pack LABA на Black Friday зі знижкою 40% (${T.full} ${plural(T.full,"пак","паки","паків")} по 3 курси):\n\n`+
    T.sets.map((s,i)=>`Skill Pack ${i+1}${s.length<3?" (неповний, без знижки)":""}:\n`+s.map((c,j)=>`${j+1}. ${fullName(c)} — ${uah(c.p)}${", старт "+(c.st||"у 2027 році")}${c.u?"\n   "+c.u:""}`).join("\n")).join("\n\n")+
    `\n\nСума: ${uah(T.sum)}\nЗнижка: −${uah(T.disc)}\nДо сплати: ${uah(T.due)}`;
}
let hintT;
function showHint(){ const n=st.pick.length, k=n%3; let h=document.getElementById("pickToast");
  if(!h){ h=document.createElement("div"); h.id="pickToast"; h.className="ptoast"; h.setAttribute("role","status"); document.body.appendChild(h); }
  h.innerHTML= k? `<b>${k} з 3</b> у Skill Pack ${Math.ceil(n/3)} — додай ще ${3-k}, і −40% спрацює на всі три` : `<b>Skill Pack ${n/3} зібрано</b> — −40% на всі три курси ✓`;
  h.classList.toggle("ok",!k); void h.offsetWidth; h.classList.add("show"); clearTimeout(hintT); hintT=setTimeout(()=>h.classList.remove("show"),3500); }
function renderCart(){
  const T=totals(), n=st.pick.length;
  let h=`<div class="cart-h"><h2>Мій Skill Pack${n?`<span class="cnt-badge num">${n}</span>`:""}</h2><button type="button" class="close" id="close" aria-label="Закрити кошик">×</button></div>`;
  if(!n){ h+=`<div class="cart-empty"><div class="set-h"><b>0 з 3 курсів</b><span class="pill off">3 курси = −40%</span></div>
      <div class="meter"><i></i><i></i><i></i></div>
      <p class="note" style="margin:10px 0 0">Додай 3 курси — і отримаєш −40% на весь чек.</p></div>
      <p class="note perks-note">Курси можна пройти самому, з колегами або віддати команді. Кожні наступні 3 — ще один Skill Pack −40%.</p>`;
    $("cart").innerHTML=h;
    $("barTxt").innerHTML=`<span class="dots"><i></i><i></i><i></i></span>Skill Pack порожній<br>3 курси = −40%`; return; }
  const sets=T.sets.length&&T.sets[T.sets.length-1].length===3&&n<MAXC?[...T.sets,[]]:T.sets.length?T.sets:[[]];
  sets.forEach((s,i)=>{ const done=s.length===3, left=3-s.length, fresh=!s.length&&i>0;
    h+=`<div class="set${done?" done":""}"><div class="set-h"><b>Skill Pack ${i+1}</b>${done?`<span class="pill">−40% ✓</span>`:`<span class="pill off">${s.length?`додай ще ${left}`:`3 курси = −40%`}</span>`}</div>
    <div class="meter">${[0,1,2].map(j=>`<i class="${j<s.length?"on":""}"></i>`).join("")}</div>${!done&&s.length?`<p class="setnote">Додай ще ${left} ${plural(left,"курс","курси","курсів")} — і знижка −40% спрацює на всі три.</p>`:""}`;
    if(fresh) h+=`<p class="note" style="font-size:13px">Додай ще три курси, і на них теж буде −40%. Що ще прокачати?</p>
      <div class="chips mini">${GROW.slice(0,5).map(g=>`<button type="button" class="chip" data-growgo="${g[0]}">+ ${g[1]}</button>`).join("")}</div>`;
    else { h+=`<ol class="slots">`;
      for(let j=0;j<3;j++){ const c=s[j];
        h+= c?`<li class="slot full"><div class="sn">${esc(c.n)}<span>${esc(c.lv)}${" · старт "+(c.st?esc(c.st):"у 2027 році")}</span></div><div class="num">${uah(c.p)}</div><button type="button" class="x" data-rm="${c.id}" aria-label="Прибрати ${esc(c.n)}">×</button></li>`
          :`<li class="slot">Місце для курсу ${j+1}</li>`; }
      h+=`</ol>`; }
    h+=`</div>`; });
  if(n){ h+=`<div class="sum num"><div><span>Сума</span><span>${uah(T.sum)}</span></div>
    ${T.disc?`<div class="disc"><span>Знижка 40% × ${T.full}</span><span>−${uah(T.disc)}</span></div>`:`<div class="lock"><span>Знижка 40%</span><span>з 3-м курсом</span></div>`}
    <div class="tot"><span>До сплати</span><span>${uah(T.due)}</span></div></div>`; }
  const sg=suggestions();
  if(sg.length) h+=`<div class="sugg"><h3>Добре доповнить</h3>${sg.map(c=>`<div class="sg"><div>${esc(c.n)}<span>${esc(c.lv)} · ${uah(c.p)}</span></div><button type="button" class="add" data-add="${c.id}">+ Додати</button></div>`).join("")}</div>`;
  if(T.full) h+=`<button type="button" class="btn" id="order">Оформити зі знижкою</button><div id="orderBox"></div>`;
  else if(!n) h+=`<p class="note">Натисни «+ У Skill Pack» на курсі або візьми готовий набір.</p>`;
  if(n) h+=`<button type="button" class="btn ghost" id="clear">Очистити кошик</button>`;
  h+=`<p class="note">Курси можна пройти самому, з колегами або віддати команді. Кожні наступні 3 — ще один Skill Pack −40% (до трьох). Остаточну ціну й оплату частинами підтвердить менеджер.</p>`;
  $("cart").innerHTML=h;
  const dots=`<span class="dots">${[0,1,2].map(k=>`<i class="${k<(n%3||(n?3:0))?"on":""}"></i>`).join("")}</span>`;
  $("barTxt").innerHTML= n? dots+`<b class="num">${uah(T.due)}</b><br>${n} ${plural(n,"курс","курси","курсів")}${T.full?` · −40% на ${T.full} Skill Pack`:` · до −40% ще ${3-n%3}`}` : dots+`Skill Pack порожній<br>3 курси = −40%`;
}

// На телефоні/планшеті кошик — шторка. Вона живе в .hero (clip-path + isolation), тож відкриту шторку переносимо в <body>, щоб її нічого не обрізало й не перекривало.
let cartHome=null;
function openCart(on){ const c=$("cart"); if(on){ const pt=document.getElementById("pickToast"); if(pt) pt.classList.remove("show"); }
  if(on&&!matchMedia("(min-width:1100px)").matches&&c.parentNode!==document.body){ cartHome=document.createComment("cart"); c.parentNode.insertBefore(cartHome,c); document.body.appendChild(c); }
  c.classList.toggle("open",on); $("shade").classList.toggle("open",on); document.documentElement.style.overflow=on&&cartHome?"hidden":"";
  if(!on&&cartHome){ setTimeout(()=>{ if(!c.classList.contains("open")&&cartHome){ cartHome.parentNode.insertBefore(c,cartHome); cartHome.remove(); cartHome=null; } },300); }
}
const isDefault=()=>!st.role&&!st.sphere&&!st.topics.length&&!st.dir&&!st.sen.length&&!st.q.trim()&&!st.who.trim()&&!st.grow.length;
function renderReset(){ document.querySelectorAll("[data-reset]").forEach(b=>b.hidden=isDefault()); }
function resetFilters(){
  Object.assign(st,{role:"",sphere:"",topics:[],dir:"",sen:[],q:"",who:"",grow:[],moreDirs:false,indSub:""});
  if($("q")) $("q").value=""; $("who").value="";
  render(); renderRoles(); $("me-h").scrollIntoView({behavior:"smooth",block:"start"});
}
function render(){ renderChips(); renderWho(); renderShop(); renderCart(); renderGrow(); renderReset(); save(); }

document.addEventListener("click",e=>{
  if(e.target.id==="shade") return openCart(false);
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.reset){ resetFilters(); }
  else if(t.dataset.sp){ st.sphere=st.sphere===t.dataset.sp?"":t.dataset.sp; render(); }
  else if(t.dataset.tp){ const k=t.dataset.tp, i=st.topics.indexOf(k);
    if(i>=0) st.topics.splice(i,1); else st.topics.push(k); render(); }
  else if(t.dataset.dir!==undefined){ st.dir=t.dataset.dir; renderShop(); renderReset(); }
  else if(t.dataset.sen){ const k=t.dataset.sen,i=st.sen.indexOf(k); if(i>=0) st.sen.splice(i,1); else st.sen.push(k); renderShop(); renderReset(); }
  else if(t.dataset.add){ const id=+t.dataset.add, i=st.pick.indexOf(id);
    if(i>=0) st.pick.splice(i,1); else if(st.pick.length<MAXC) st.pick.push(id); render();
    if(i<0) showHint(); if(i<0) for(const el of [$("cart"),$("bar")]){ el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
    if(st.pick.length%3===0 && i<0 && innerWidth<=960) openCart(true); }
  else if(t.dataset.rm){ st.pick=st.pick.filter(x=>x!==+t.dataset.rm); render(); }
  else if(t.dataset.ready){ const ids=t.dataset.ready.split(",").map(Number);
    // нічого з кошика не викидаємо: готовий набір стає окремим паком, а недозібрані курси лишаються й чекають на свій пак
    const cut=st.pick.length-st.pick.length%3, full=st.pick.slice(0,cut), part=st.pick.slice(cut);
    const fresh=ids.filter(id=>!st.pick.includes(id)).slice(0,Math.max(0,MAXC-st.pick.length));
    st.pick=[...full,...fresh,...part];
    render(); if(innerWidth<=960) openCart(true); }
  else if(t.dataset.grow){ const k=t.dataset.grow, i=st.grow.indexOf(k); if(i>=0) st.grow.splice(i,1); else st.grow.push(k); render(); }
  else if(t.dataset.growgo){ if(!st.grow.includes(t.dataset.growgo)) st.grow.push(t.dataset.growgo); openCart(false); render(); $("grow").scrollIntoView({behavior:"smooth",block:"start"}); }
  else if(t.dataset.ask){ applyAsk(t.dataset.ask,t.dataset.val); }
  else if(t.dataset.niche){ $("who").value=st.who=st.who.replace(/[.,;\s]+$/,"")+": "+t.dataset.niche; render(); }
  else if(t.dataset.exmore){ $("examples").classList.add("open"); }
  else if(t.dataset.role){ const k=t.dataset.role, prev=ROLES.find(r=>r[0]===st.role);
    if(prev&&prev[3]) st.grow=st.grow.filter(g=>g!==prev[3]);
    st.role=st.role===k?"":k;
    const cur=ROLES.find(r=>r[0]===st.role);
    if(cur&&cur[3]&&!st.grow.includes(cur[3])) st.grow=[cur[3],...st.grow];
    renderRoles(); renderGrow(); renderReset(); save(); }
  else if(t.dataset.indsub){ st.indSub=st.indSub===t.dataset.indsub?"":t.dataset.indsub; renderGrow(); }
  else if(t.dataset.moredirs){ st.moreDirs=!st.moreDirs; renderGrow(); }
  else if(t.dataset.growopen){ st.growOpen=!st.growOpen; renderGrow(); }
  else if(t.dataset.ex){ typeInto(t.dataset.ex); }
  else if(t.id==="whoGo"){ const w=$("who"); if(!w.value.trim()){ w.focus(); return; } const r=$("meRes"); if(r&&!r.hidden) r.scrollIntoView({behavior:"smooth",block:"start"}); }
  else if(t.id==="whoClear"){ $("who").value=st.who=""; render(); $("who").focus(); }
  else if(t.id==="clear"){ st.pick=[]; render(); }
  else if(t.id==="barBtn"){ openCart(true); }
  else if(t.id==="close"){ openCart(false); }
  else if(t.id==="order"){ const txt=orderText();
    $("orderBox").innerHTML=`<div class="order"><p class="note">Ось твоє замовлення. Скопіюй і надішли менеджеру LABA в месенджер, він закріпить знижку і надішле посилання на оплату.</p>
      <textarea class="copybox" id="cb" readonly aria-label="Текст замовлення">${esc(txt)}</textarea>
      <button type="button" class="btn ghost" id="copy">Скопіювати</button><p class="toast" id="toast"></p></div>`; }
  else if(t.id==="copy"){ const ta=$("cb");
    try{ navigator.clipboard.writeText(ta.value).then(()=>{$("toast").textContent="Скопійовано.";},()=>{ta.select();$("toast").textContent="Виділи текст і скопіюй вручну.";}); }
    catch(err){ ta.select(); $("toast").textContent="Виділи текст і скопіюй вручну."; } }
});
$("q")&&$("q").addEventListener("input",e=>{ st.q=e.target.value; renderShop(); renderReset(); });
let whoT; $("who").addEventListener("input",e=>{ st.who=e.target.value; clearTimeout(whoT); whoT=setTimeout(()=>{renderWho(); renderShop(); renderCart(); renderGrow(); renderReset();},200); });
let typing=0;
function typeInto(s){ const w=$("who"), my=++typing; let i=0; w.value=""; stopPh();
  (function step(){ if(my!==typing) return; i+=2; w.value=s.slice(0,i); if(i<s.length) setTimeout(step,18); else { st.who=s; render(); const r=$("meRes"); if(r&&!r.hidden&&innerWidth<1100) setTimeout(()=>r.scrollIntoView({behavior:"smooth",block:"start"}),150); } })(); }
let phT, phOn=true;
function stopPh(){ phOn=false; clearTimeout(phT); $("who").placeholder="Наприклад: власниця кав'ярні, хочу навести лад у фінансах"; }
(function ph(){ const w=$("who"); if(!w) return; const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches; if(reduce) return;
  let k=0,i=0,dir=1;
  (function tick(){ if(!phOn) return; if(document.activeElement===w||w.value){ phT=setTimeout(tick,800); return; }
    const s=EXAMPLES[k%EXAMPLES.length]; i+=dir;
    w.placeholder=s.slice(0,i)+(dir>0?"|":"");
    if(dir>0&&i>=s.length){ dir=-1; phT=setTimeout(tick,1600); return; }
    if(dir<0&&i<=0){ dir=1; k++; phT=setTimeout(tick,300); return; }
    phT=setTimeout(tick,dir>0?55:18); })(); })();
$("who").addEventListener("focus",()=>{ $("who").placeholder="Наприклад: власниця кав'ярні, хочу навести лад у фінансах"; });
const ROLES=[["own","Власник","own",""],["head","Керівник","head",""],["fin","Фінансист","spec","fin"],["mkt","Маркетолог","spec","mkt"],["data","Аналітик","spec","data"],["hr","HR","spec","hr"],["law","Юрист","spec","law"],["nov","Новачок","nov",""]];
function renderRoles(){ $("roles").innerHTML=ROLES.map(([k,l])=>`<button type="button" class="role-chip" data-role="${k}" aria-pressed="${st.role===k}">${esc(l)}</button>`).join(""); }
renderRoles();
document.addEventListener("keydown",e=>{ if(e.key==="Escape") openCart(false); });
render();
</script>
